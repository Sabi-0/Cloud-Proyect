# Archivo: cloudbuild.yaml
steps:
  # 1. Construye la imagen Docker usando el Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/insta-cloud-mvp:$SHORT_SHA',
        '.',
      ]

  # 2. Sube la imagen Docker al registro de artefactos de Google
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/insta-cloud-mvp:$SHORT_SHA']

  # 3. Despliega la imagen en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'insta-cloud-mvp', # Nombre de tu servicio en Cloud Run
        '--image',
        'gcr.io/$PROJECT_ID/insta-cloud-mvp:$SHORT_SHA',
        '--region',
        'us-central1', # Cambia esto a la región que prefieras
        '--platform',
        'managed',
        '--allow-unauthenticated', # ¡Importante! Permite que cualquiera acceda a tu app
      ]

# Guardar la imagen en el registro
images:
  - 'gcr.io/$PROJECT_ID/insta-cloud-mvp:$SHORT_SHA'