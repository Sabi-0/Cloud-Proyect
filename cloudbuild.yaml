# Archivo: cloudbuild.yaml
steps:
  # 1. Construye la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/insta-cloud-mvp:$SHORT_SHA',
        '.',
      ]

  # 2. Sube la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/insta-cloud-mvp:$SHORT_SHA']

  # 3. Despliega la imagen en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'insta-cloud-mvp', 
        '--image',
        'gcr.io/$PROJECT_ID/insta-cloud-mvp:$SHORT_SHA',
        '--region',
        'us-central1', 
        '--platform',
        'managed',
        '--allow-unauthenticated', 
      ]

# Guardar la imagen en el registro
images:
  - 'gcr.io/$PROJECT_ID/insta-cloud-mvp:$SHORT_SHA'

# ¡ESTA ES LA LÍNEA NUEVA QUE SOLUCIONA EL ERROR!
options:
  logging: CLOUD_LOGGING_ONLY