<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta-Cloud MVP</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; background: #f4f4f4; }
        h1, h2 { text-align: center; }
        form { padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        div { margin-bottom: 15px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .post { background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        .post img { width: 100%; height: 200px; object-fit: cover; }
        .post p { padding: 10px; }
    </style>
</head>
<body>

    <h1>Insta-Cloud MVP</h1>
    <h2>Proyecto de Cloud Computing</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <div>
            <label for="description">Descripción:</label>
            <input type="text" id="description" name="description" required>
        </div>
        <div>
            <label for="image">Subir Foto:</label>
            <input type="file" id="image" name="image" accept="image/*" required>
        </div>
        <button type="submit">Publicar</button>
    </form>

    <h2>Galería</h2>
    <div id="gallery">
        </div>

    <script>
        async function loadPosts() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = 'Cargando...';

            try {
                const response = await fetch('/posts');
                if (!response.ok) throw new Error('Error al cargar');
                
                const posts = await response.json();
                gallery.innerHTML = ''; // Limpiar

                if (posts.length === 0) {
                    gallery.innerHTML = '<p>No hay fotos todavía. ¡Sube la primera!</p>';
                    return;
                }

                posts.forEach(post => {
                    const postElement = document.createElement('div');
                    postElement.className = 'post';
                    postElement.innerHTML = `
                        <img src="${post.imageUrl}" alt="${post.description}">
                        <p>${post.description}</p>
                    `;
                    gallery.appendChild(postElement);
                });

            } catch (error) {
                gallery.innerHTML = '<p>Error al cargar la galería.</p>';
            }
        }

        // Cargar las fotos cuando la página esté lista
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>

</body>
</html>
